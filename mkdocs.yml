site_name: LEDGER
site_url: https://LEDGER-project.github.io
repo_name: LEDGER-project/LEDGER-project.github.io
repo_url: https://github.com/LEDGER-project/LEDGER-project.github.io
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: Jet Brains Mono

  #favicon: assets/favicon.ico
  #logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    #- toc.follow
    #- toc.integrate # uncomment if want toc scaffolded on left sidebar
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.superfences
  - pymdownx.details # need to make admonitions collapsible
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - attr_list # to make buttons
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: spacy
            show_submodules: false
            docstring_style: google
            show_root_heading: true
            show_source: true
            show_signature: true
            heading_level: 2
            members_order: source
            separate_signature: true
            filters: ["!^_"]
            show_symbol_type_heading: true
  - mkdocs-jupyter:
      execute: true # Execute notebooks during build
      include_source: true # Add download link for source notebooks
      theme: dark # Use dark theme for code cells
      include: ["*.ipynb", "*.nb.py"] # File patterns to include
      execute_ignore: ["notebooks/drafts/*.ipynb"] # Skip certain files
      allow_errors: false # Fail build on notebook errors
      kernel_name: python3 # Specify kernel to use
      ignore_h1_titles: false # Include H1 from notebooks
      show_input: true # Show input cells by default
      no_input: false # Don't hide all inputs
      remove_tag_config:
        remove_cell_tags:
          - "hide" # Hide cells with these tags
          - "hide-cell"
        remove_all_outputs_tags:
          - "hide-output" # Hide outputs for tagged cells
        remove_input_tags:
          - "hide-input" # Hide input for tagged cells

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Python Client:
      - Getting Started:
          - Installation: getting-started/installation.md
          - Using the client: getting-started/using-the-client.md
      - Client API: api/client.md
  - Database and REST API:
      - Database Architecture: database-and-api/database-architecture.md
      - Database Tables Details: database-and-api/table-details.md
      - REST API: database-and-api/rest-api.md
  - Examples:
      - Introduction: notebooks/intro.nb.py
